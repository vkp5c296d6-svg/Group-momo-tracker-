<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group MoMo Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
    }
    h1 { text-align: center; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 9px 0;
      font-size: 16px;
    }
    button {
      background: #087d50;
      color: white;
      border: 0;
      border-radius: 6px;
    }
    .payment {
      background: #f1f5f3;
      padding: 12px;
      margin: 10px 0;
      border-radius: 7px;
      overflow-wrap: anywhere;
    }
    #message { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Group MoMo Tracker</h1>

    <form id="paymentForm">
      <input id="name" placeholder="Full Name" required>
      <input id="reference"
        placeholder="MoMo Transaction Reference" required>
      <button type="submit">Submit Payment</button>
    </form>

    <p id="message"></p>

    <h2>Members Payment List</h2>
    <div id="payments">Loading payments...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl =
      "https://puatrpgwhwbbvuinkypm.supabase.co";

    const supabaseKey =
      "sb_publishable_ieAgCN7gjrGdxVTHNMrtfQ_gt2Mrn3X";

    const db = window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    const form = document.getElementById("paymentForm");
    const message = document.getElementById("message");
    const paymentList = document.getElementById("payments");

    async function loadPayments() {
      const { data, error } = await db
        .from("payments")
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        paymentList.textContent = "Could not load payments.";
        return;
      }

      paymentList.replaceChildren();

      data.forEach(payment => {
        const item = document.createElement("div");
        item.className = "payment";

        const name = document.createElement("strong");
        name.textContent = payment.full_name;

        const reference = document.createElement("p");
        reference.textContent =
          "Reference: " + payment.transaction_reference;

        const status = document.createElement("p");
        status.textContent = "Status: " + payment.status;

        item.append(name, reference, status);
        paymentList.appendChild(item);
      });

      if (data.length === 0) {
        paymentList.textContent = "No payments submitted yet.";
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName = document.getElementById("name").value.trim();
      const reference =
        document.getElementById("reference").value.trim();

      message.textContent = "Submitting...";

      const { error } = await db
        .from("payments")
        .insert([{
          full_name: fullName,
          transaction_reference: reference
        }]);

      if (error) {
        message.textContent = "Submission failed. Please try again.";
        return;
      }

      message.textContent = "Payment submitted successfully!";
      form.reset();
      loadPayments();
    });

    loadPayments();
  </script>
</body>
</html>
